<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleSwap · Pinterest Inspiration to Reality</title>
<meta name="description" content="Prototype: pick one item in a room image, choose what to change, and see real alternatives, an item match and an estimated whole-room fit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#panel">Skip to item panel</a>

<header class="top">
  <div class="brand">
    <div>
      <div class="brand-name">StyleSwap <span class="concept-pill">Concept for Pinterest</span></div>
      <div class="crumb">Saved Pin › Recreate this look · student prototype, not affiliated with Pinterest</div>
    </div>
  </div>
  <div class="controls">
    <label class="ctl">
      <span class="ctl-label">Room style</span>
      <select id="aesthetic" aria-label="Room style"></select>
    </label>
    <label class="ctl">
      <span class="ctl-label">Target budget</span>
      <span class="rupee-input">₹<input id="budget" type="number" inputmode="numeric" min="1000" max="1000000" step="500" aria-label="Target budget in rupees"></span>
    </label>
    <button class="ctl ctl-btn" id="openOptimizer" type="button"><span class="ctl-label">Best combination</span>Fit my budget</button>
    <button class="ctl ctl-btn" id="openVersions" type="button"><span class="ctl-label">Saved versions</span><span id="versionName">Versions</span></button>
    <button class="ctl ctl-btn ghost" id="openGuide" type="button"><span class="ctl-label">How it works</span>Guide</button>
  </div>
</header>

<main class="layout">
  <section class="room-col" aria-label="Room">
    <div class="room-wrap">
    <figure class="room" id="room">
      <img id="roomImg" alt="">
      <canvas id="tint" aria-hidden="true"></canvas>
      <div id="pins"></div>
      <figcaption class="credit" id="credit"></figcaption>
    </figure>
      <div class="room-tools">
        <div class="seg" role="group" aria-label="Colour preview on the image">
          <button type="button" data-view="photo" aria-pressed="true">Original image</button>
          <button type="button" data-view="plan" aria-pressed="false">My plan colours</button>
        </div>
        <div class="seg" id="baToggle" role="group" aria-label="Before and after" hidden>
          <button type="button" data-ba="before" aria-pressed="false">Before</button>
          <button type="button" data-ba="after" aria-pressed="true">After</button>
        </div>
      </div>
    </div>
    <p class="preview-note" id="previewNote" hidden></p>
    <ol class="rail" id="rail" aria-label="Items in this room"></ol>
    <section class="stylecheck card-soft" id="styleCheck" aria-live="polite"></section>
  </section>

  <section class="panel" id="panel" tabindex="-1" aria-label="Selected item"></section>
</main>

<footer class="planbar" id="planbar" aria-label="Reality Plan"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgVersions" aria-labelledby="dvT"></dialog>
<dialog id="dlgOptimizer" aria-labelledby="doT"></dialog>
<dialog id="dlgCompare" aria-labelledby="dcT" class="wide"></dialog>
<dialog id="dlgPlan" aria-labelledby="dpT" class="wide"></dialog>
<dialog id="dlgGuide" aria-labelledby="dgT" class="wide"></dialog>

<script src="js/color.js"></script>
<script src="js/scoring.js"></script>
<script src="js/modes.js"></script>
<script src="js/optimizer.js"></script>
<script src="js/plan.js"></script>
<script src="js/recolor.js"></script>
<script src="data/room.js"></script>
<script src="data/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
